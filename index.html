<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Barra de Jackili - Hero</title>

  <style>
    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk Light.otf") format("opentype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "SansitaSwashed";
      src: url("assets/fonts/SansitaSwashed-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --blue: #006eed;
      --blue-dark: #0059c7;
      --blue-soft: #6fb1f8;
      --white: #ffffff;
      --nav-text: #0056bd;
      --nav-width: 1115px;
      --nav-height: 82px;
      --radius-pill: 999px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--blue);
      font-family: "RocGrotesk", Arial, sans-serif;
      color: var(--white);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: 0;
      background: transparent;
      font-family: inherit;
      cursor: pointer;
    }

    .page-hero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: var(--blue);
    }

    /* =========================
       HEADER / BARRA SUPERIOR
    ========================= */

    .site-header {
      position: relative;
      z-index: 30;
      width: 100%;
      padding: 38px 20px 0;
    }

    .navbar {
      width: min(var(--nav-width), calc(100vw - 32px));
      height: var(--nav-height);
      margin: 0 auto;
      padding: 0 18px 0 30px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: var(--white);
      border-radius: var(--radius-pill);
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 42px;
    }

    .nav-group-left {
      justify-content: flex-start;
    }

    .nav-group-right {
      justify-content: flex-end;
      gap: 38px;
    }

    .nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 22px;
      color: var(--nav-text);
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 17px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.01em;
      white-space: nowrap;
      transition:
        color 0.25s ease,
        transform 0.25s ease;
    }

    .nav-link::before,
    .nav-link::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 27px;
      height: 15px;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .nav-link::before {
      left: -5px;
      background-image: url("assets/img/left.svg");
      transform: translate(-8px, -50%);
    }

    .nav-link::after {
      right: -5px;
      background-image: url("assets/img/right.svg");
      transform: translate(8px, -50%);
    }

    .nav-link:hover {
      color: var(--blue);
      transform: translateY(-1px);
    }

    .nav-link:hover::before,
    .nav-link:hover::after {
      opacity: 1;
      transform: translate(0, -50%);
    }

    .brand {
      width: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand img {
      width: 100%;
      height: auto;
      display: block;
      transition:
        transform 0.28s ease,
        filter 0.28s ease;
    }

    .brand:hover img {
      transform: scale(1.035);
    }

    .reserve-top {
      height: 58px;
      padding: 0 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--blue);
      color: var(--white);
      border-radius: var(--radius-pill);
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 17px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.01em;
      white-space: nowrap;
      transition:
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .reserve-top img {
      width: 25px;
      height: 25px;
      object-fit: contain;
      display: block;
    }

    .reserve-top:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 60, 140, 0.22);
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--blue);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
    }

    .menu-toggle span {
      width: 20px;
      height: 2px;
      display: block;
      background: var(--white);
      border-radius: 20px;
      transition: 0.25s ease;
    }

    .menu-toggle.is-active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .menu-toggle.is-active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.is-active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      z-index: 5;
      width: min(1115px, calc(100vw - 32px));
      min-height: calc(100vh - 120px);
      margin: 0 auto;
      padding-top: 38px;
      display: grid;
      grid-template-columns: 46% 54%;
      align-items: center;
    }

    .hero-visual {
      position: relative;
      min-height: 535px;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }

    .hero-person {
      position: absolute;
      left: -33px;
      bottom: -1px;
      z-index: 2;
      width: min(457.35px, 42vw);
      height: auto;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .fresh-seal {
      position: absolute;
      left: -8px;
      top: 300px;
      z-index: 5;
      width: 118px;
      height: 118px;
      display: block;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .hero-caption {
      position: absolute;
      left: 157px;
      bottom: 80px;
      z-index: 6;
      width: 205px;
      color: var(--white);
      text-align: center;
      pointer-events: none;
    }

    .hero-caption .small {
      display: block;
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 22px;
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: 0.01em;
      opacity: 0.72;
    }

    .hero-caption .script {
      display: block;
      margin-top: -2px;
      font-family: "SansitaSwashed", cursive;
      font-size: 31px;
      font-weight: 500;
      line-height: 0.9;
      color: var(--white);
      text-shadow: 0 2px 5px rgba(0, 30, 90, 0.12);
    }

    .hero-content {
      position: relative;
      z-index: 8;
      padding-left: 12px;
      transform: translateY(-10px);
    }

    .hero-title {
      max-width: 650px;
      color: var(--white);
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: clamp(68px, 8.55vw, 126px);
      font-weight: 500;
      line-height: 0.85;
      letter-spacing: -0.045em;
    }

    .hero-title span {
      display: block;
    }

    .hero-title .soft {
      padding-left: 118px;
      color: var(--blue-soft);
    }

    .hero-copy {
      width: min(560px, 100%);
      margin-top: 47px;
      color: var(--white);
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 1.28;
      letter-spacing: 0.01em;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 34px;
      margin-top: 32px;
    }

    .btn {
      height: 60px;
      min-width: 173px;
      padding: 0 31px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .btn img {
      width: 21px;
      height: 21px;
      object-fit: contain;
      display: block;
    }

    .btn-white {
      background: var(--white);
      color: var(--blue);
      border: 2px solid var(--white);
    }

    .btn-white:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(0, 45, 120, 0.22);
    }

    .btn-outline {
      min-width: 218px;
      background: transparent;
      color: var(--white);
      border: 2px solid var(--white);
    }

    .btn-outline:hover {
      background: var(--white);
      color: var(--blue);
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(0, 45, 120, 0.18);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {
      :root {
        --nav-height: 70px;
      }

      .site-header {
        padding: 18px 16px 0;
      }

      .navbar {
        position: relative;
        width: 100%;
        padding: 0 15px 0 21px;
        display: flex;
        justify-content: space-between;
      }

      .brand {
        width: 150px;
      }

      .menu-toggle {
        display: flex;
      }

      .nav-group {
        position: absolute;
        left: 50%;
        width: min(360px, calc(100vw - 32px));
        padding: 18px 20px;
        background: var(--white);
        border-radius: 28px;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateX(-50%) translateY(-8px);
        box-shadow: 0 16px 35px rgba(0, 30, 90, 0.18);
        transition: 0.25s ease;
      }

      .nav-group-left {
        top: calc(100% + 14px);
      }

      .nav-group-right {
        top: calc(100% + 155px);
      }

      .navbar.is-open .nav-group {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }

      .nav-link {
        width: 100%;
        min-height: 42px;
        justify-content: center;
        font-size: 17px;
      }

      .reserve-top {
        width: 100%;
        height: 52px;
      }

      .hero {
        width: min(430px, calc(100vw - 28px));
        min-height: auto;
        padding-top: 44px;
        display: flex;
        flex-direction: column;
      }

      .hero-content {
        order: 1;
        width: 100%;
        padding-left: 0;
        text-align: center;
        transform: none;
      }

      .hero-title {
        max-width: 100%;
        font-size: clamp(54px, 17vw, 76px);
        line-height: 0.88;
      }

      .hero-title .soft {
        padding-left: 0;
      }

      .hero-copy {
        width: 100%;
        margin-top: 26px;
        font-size: 18px;
        line-height: 1.38;
      }

      .hero-actions {
        width: 100%;
        margin-top: 26px;
        gap: 14px;
        justify-content: center;
        flex-direction: column;
      }

      .btn {
        width: min(310px, 100%);
        height: 56px;
        font-size: 17px;
      }

      .hero-visual {
        order: 2;
        width: 100%;
        min-height: 460px;
        margin-top: 20px;
      }

      .hero-person {
        left: 50%;
        bottom: 0;
        width: min(360px, 92vw);
        transform: translateX(-50%);
      }

      .fresh-seal {
        left: 4px;
        top: 135px;
        width: 96px;
        height: 96px;
      }

      .hero-caption {
        left: 50%;
        bottom: 56px;
        width: 190px;
        transform: translateX(-50%);
      }

      .hero-caption .small {
        font-size: 18px;
      }

      .hero-caption .script {
        font-size: 26px;
      }
    }

    @media (max-width: 480px) {
      .brand {
        width: 132px;
      }

      .hero-visual {
        min-height: 410px;
      }

      .hero-person {
        width: min(330px, 96vw);
      }

      .fresh-seal {
        left: 0;
        top: 130px;
        width: 88px;
        height: 88px;
      }
    }
  </style>
</head>

<body>
  <main class="page-hero">

    <header class="site-header">
      <nav class="navbar" id="navbar" aria-label="Menú principal">

        <div class="nav-group nav-group-left">
          <a href="#carta" class="nav-link">Carta</a>
          <a href="#historia" class="nav-link">Historia</a>
        </div>

        <a href="#inicio" class="brand" aria-label="La Barra de Jackili">
          <img src="assets/img/Logo.png" alt="La Barra de Jackili Cevichería">
        </a>

        <div class="nav-group nav-group-right">
          <a href="#ubicacion" class="nav-link">Ubicación</a>

          <a
            href="https://wa.me/51972667751?text=Hola%20La%20Barra%20de%20Jackili%2C%20quiero%20reservar%20una%20mesa."
            class="reserve-top"
            target="_blank"
            rel="noopener"
          >
            <img src="assets/icons/whatsapp.png" alt="">
            <span>Reservar</span>
          </a>
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

      </nav>
    </header>

    <section class="hero" id="inicio">

      <div class="hero-visual">
        <img
          src="assets/img/imgen_hero.png"
          alt="La Barra de Jackili"
          class="hero-person"
        >

        <img
          src="assets/img/sello.png"
          alt="Fresco del mar"
          class="fresh-seal"
        >

        <div class="hero-caption">
          <span class="small">Más rico de</span>
          <span class="script">todo el Perú</span>
        </div>
      </div>

      <div class="hero-content">
        <h1 class="hero-title">
          <span>El mar</span>
          <span>en un solo</span>
          <span class="soft">bocado</span>
        </h1>

        <p class="hero-copy">
          Pescados y mariscos con sabor criollo, frescura del mar y platos abundantes que te conquistan desde el primer bocado.
        </p>

        <div class="hero-actions">
          <a href="#carta" class="btn btn-white">
            <img src="assets/icons/carta.png" alt="">
            <span>Ver carta</span>
          </a>

          <a
            href="https://wa.me/51972667751?text=Hola%20La%20Barra%20de%20Jackili%2C%20quiero%20reservar%20una%20mesa."
            class="btn btn-outline"
            target="_blank"
            rel="noopener"
          >
            <img src="assets/icons/whatsapp.png" alt="">
            <span>Reservar</span>
          </a>
        </div>
      </div>

    </section>

  </main>

  <script>
    const navbar = document.getElementById("navbar");
    const menuToggle = document.getElementById("menuToggle");

    menuToggle.addEventListener("click", () => {
      const isOpen = navbar.classList.toggle("is-open");
      menuToggle.classList.toggle("is-active", isOpen);
      menuToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });

    document.querySelectorAll(".nav-link, .reserve-top").forEach((item) => {
      item.addEventListener("click", () => {
        navbar.classList.remove("is-open");
        menuToggle.classList.remove("is-active");
        menuToggle.setAttribute("aria-expanded", "false");
      });
    });
  </script>
</body>
</html>
