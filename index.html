<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>La Barra de Jackili</title>

  <style>
    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk Light.otf") format("opentype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "SansitaSwashed";
      src: url("assets/fonts/SansitaSwashed-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --blue: #006eed;
      --blue-dark: #005cc9;
      --blue-soft: #71b3fa;
      --white: #ffffff;
      --nav-text: #0056bd;
      --shadow: 0 18px 40px rgba(0, 37, 105, 0.18);
      --pill: 999px;
      --container: 1115px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--blue);
      color: var(--white);
      font-family: "RocGrotesk", Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: 0;
      font-family: inherit;
      cursor: pointer;
      background: transparent;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .page {
      min-height: 100vh;
      background: var(--blue);
      overflow: hidden;
    }

    /* =========================
       HEADER MOBILE FIRST
    ========================= */

    .site-header {
      position: relative;
      z-index: 50;
      width: 100%;
      padding: 18px 14px 0;
    }

    .navbar {
      position: relative;
      width: 100%;
      min-height: 70px;
      padding: 0 14px 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--white);
      border-radius: var(--pill);
      box-shadow: 0 10px 28px rgba(0, 40, 120, 0.08);
    }

    .brand {
      width: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }

    .brand:hover {
      transform: scale(1.035);
    }

    .brand img {
      width: 100%;
      height: auto;
    }

    .menu-toggle {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .menu-toggle:hover {
      background: var(--blue-dark);
      transform: scale(1.04);
    }

    .menu-toggle span {
      width: 20px;
      height: 2px;
      display: block;
      border-radius: 50px;
      background: var(--white);
      transition: 0.25s ease;
    }

    .menu-toggle.is-active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .menu-toggle.is-active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.is-active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .nav-menu {
      position: absolute;
      top: calc(100% + 12px);
      left: 0;
      width: 100%;
      padding: 16px;
      display: grid;
      gap: 10px;
      background: var(--white);
      border-radius: 28px;
      box-shadow: var(--shadow);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
    }

    .navbar.is-open .nav-menu {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    .nav-link {
      position: relative;
      min-height: 46px;
      padding: 0 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--nav-text);
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 17px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.01em;
      border-radius: var(--pill);
      transition: color 0.25s ease, transform 0.25s ease, background 0.25s ease;
    }

    .nav-link::before,
    .nav-link::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 27px;
      height: 15px;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .nav-link::before {
      left: 10px;
      background-image: url("assets/img/left.svg");
      transform: translate(-7px, -50%);
    }

    .nav-link::after {
      right: 10px;
      background-image: url("assets/img/right.svg");
      transform: translate(7px, -50%);
    }

    .nav-link:hover {
      color: var(--blue);
      background: rgba(0, 110, 237, 0.06);
      transform: translateY(-1px);
    }

    .nav-link:hover::before,
    .nav-link:hover::after {
      opacity: 1;
      transform: translate(0, -50%);
    }

    .reserve-top {
      min-height: 52px;
      padding: 0 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: var(--white);
      background: var(--blue);
      border-radius: var(--pill);
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 17px;
      font-weight: 500;
      line-height: 1;
      transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .reserve-top img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .reserve-top:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 75, 165, 0.22);
    }

    /* =========================
       HERO MOBILE FIRST
    ========================= */

    .hero {
      position: relative;
      z-index: 5;
      width: 100%;
      padding: 42px 18px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-content {
      width: min(430px, 100%);
      text-align: center;
      position: relative;
      z-index: 8;
    }

    .hero-title {
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: clamp(56px, 17vw, 82px);
      font-weight: 500;
      line-height: 0.86;
      letter-spacing: -0.045em;
      color: var(--white);
    }

    .hero-title span {
      display: block;
    }

    .hero-title .soft {
      color: var(--blue-soft);
    }

    .hero-copy {
      width: min(360px, 100%);
      margin: 24px auto 0;
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: 0.01em;
      color: var(--white);
    }

    .hero-actions {
      width: 100%;
      margin-top: 26px;
      display: grid;
      gap: 13px;
      justify-items: center;
    }

    .btn {
      width: min(310px, 100%);
      min-height: 56px;
      padding: 0 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: var(--pill);
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 17px;
      font-weight: 500;
      line-height: 1;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn img {
      width: 21px;
      height: 21px;
      object-fit: contain;
    }

    .btn-white {
      color: var(--blue);
      background: var(--white);
      border: 2px solid var(--white);
    }

    .btn-white:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 40, 120, 0.24);
    }

    .btn-outline {
      color: var(--white);
      background: transparent;
      border: 2px solid var(--white);
    }

    .btn-outline:hover {
      color: var(--blue);
      background: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 40, 120, 0.2);
    }

    .hero-visual {
      position: relative;
      width: min(390px, 100%);
      height: 430px;
      margin-top: 28px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .hero-person {
      position: absolute;
      left: 50%;
      bottom: 0;
      z-index: 2;
      width: min(348px, 95vw);
      height: auto;
      transform: translateX(-50%);
      user-select: none;
      pointer-events: none;
    }

    .fresh-seal {
      position: absolute;
      left: 0;
      top: 124px;
      z-index: 6;
      width: 88px;
      height: 88px;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .hero-caption {
      position: absolute;
      left: 50%;
      bottom: 54px;
      z-index: 7;
      width: 190px;
      transform: translateX(-50%);
      color: var(--white);
      text-align: center;
      pointer-events: none;
    }

    .hero-caption .small {
      display: block;
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 18px;
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: 0.01em;
      opacity: 0.72;
    }

    .hero-caption .script {
      display: block;
      margin-top: -2px;
      font-family: "SansitaSwashed", cursive;
      font-size: 26px;
      font-weight: 500;
      line-height: 0.92;
      color: var(--white);
      text-shadow: 0 2px 5px rgba(0, 30, 90, 0.12);
    }

    /* =========================
       MOBILE SMALL
    ========================= */

    @media (max-width: 390px) {
      .site-header {
        padding-left: 10px;
        padding-right: 10px;
      }

      .navbar {
        min-height: 66px;
        padding-left: 18px;
        padding-right: 12px;
      }

      .brand {
        width: 122px;
      }

      .hero {
        padding-left: 14px;
        padding-right: 14px;
        padding-top: 36px;
      }

      .hero-title {
        font-size: clamp(52px, 16.5vw, 68px);
      }

      .hero-copy {
        font-size: 17px;
      }

      .hero-visual {
        height: 405px;
      }

      .hero-person {
        width: min(326px, 96vw);
      }

      .fresh-seal {
        width: 82px;
        height: 82px;
        top: 125px;
      }
    }

    /* =========================
       TABLET
    ========================= */

    @media (min-width: 768px) {
      .site-header {
        padding: 28px 28px 0;
      }

      .navbar {
        width: min(720px, 100%);
        min-height: 76px;
        padding-left: 28px;
        padding-right: 18px;
      }

      .brand {
        width: 170px;
      }

      .hero {
        padding-top: 58px;
      }

      .hero-content {
        width: min(620px, 100%);
      }

      .hero-title {
        font-size: clamp(84px, 12vw, 112px);
      }

      .hero-copy {
        width: min(520px, 100%);
        font-size: 22px;
      }

      .hero-actions {
        display: flex;
        justify-content: center;
        gap: 22px;
      }

      .btn {
        width: auto;
        min-width: 180px;
        min-height: 58px;
      }

      .hero-visual {
        width: min(500px, 100%);
        height: 560px;
      }

      .hero-person {
        width: min(440px, 72vw);
      }

      .fresh-seal {
        width: 112px;
        height: 112px;
        top: 210px;
        left: 6px;
      }

      .hero-caption {
        bottom: 72px;
      }

      .hero-caption .small {
        font-size: 22px;
      }

      .hero-caption .script {
        font-size: 31px;
      }
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 1024px) {
      .page {
        min-height: 100vh;
      }

      .site-header {
        padding: 38px 20px 0;
      }

      .navbar {
        width: min(var(--container), calc(100vw - 32px));
        min-height: 82px;
        padding: 0 18px 0 30px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
      }

      .brand {
        width: 200px;
      }

      .menu-toggle {
        display: none;
      }

      .nav-menu {
        position: static;
        width: auto;
        padding: 0;
        display: contents;
        background: transparent;
        border-radius: 0;
        box-shadow: none;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: none;
      }

      .nav-side {
        display: flex;
        align-items: center;
      }

      .nav-side-left {
        justify-content: flex-start;
        gap: 42px;
      }

      .nav-side-right {
        justify-content: flex-end;
        gap: 38px;
      }

      .nav-link {
        min-height: 36px;
        padding: 0 22px;
        font-size: 17px;
      }

      .nav-link::before {
        left: -5px;
      }

      .nav-link::after {
        right: -5px;
      }

      .reserve-top {
        min-height: 58px;
        padding: 0 30px;
      }

      .hero {
        width: min(var(--container), calc(100vw - 32px));
        min-height: calc(100vh - 120px);
        margin: 0 auto;
        padding: 38px 0 0;
        display: grid;
        grid-template-columns: 46% 54%;
        align-items: center;
      }

      .hero-content {
        width: 100%;
        max-width: none;
        order: 2;
        padding-left: 12px;
        text-align: left;
        transform: translateY(-10px);
      }

      .hero-title {
        max-width: 650px;
        font-size: clamp(76px, 8.55vw, 126px);
        line-height: 0.85;
      }

      .hero-title .soft {
        padding-left: 118px;
      }

      .hero-copy {
        width: min(560px, 100%);
        margin: 47px 0 0;
        font-size: 24px;
        line-height: 1.28;
      }

      .hero-actions {
        margin-top: 32px;
        display: flex;
        justify-content: flex-start;
        gap: 34px;
      }

      .btn {
        min-height: 60px;
        min-width: 173px;
        width: auto;
        padding: 0 31px;
        font-size: 18px;
      }

      .btn-outline {
        min-width: 218px;
      }

      .hero-visual {
        order: 1;
        width: 100%;
        height: 100%;
        min-height: 535px;
        margin-top: 0;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
      }

      .hero-person {
        left: -33px;
        bottom: -1px;
        width: min(457.35px, 42vw);
        transform: none;
      }

      .fresh-seal {
        left: -8px;
        top: 300px;
        width: 118px;
        height: 118px;
      }

      .hero-caption {
        left: 157px;
        bottom: 80px;
        width: 205px;
        transform: none;
      }

      .hero-caption .small {
        font-size: 22px;
      }

      .hero-caption .script {
        font-size: 31px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="site-header">
      <nav class="navbar" id="navbar" aria-label="Menú principal">

        <a href="#inicio" class="brand" aria-label="La Barra de Jackili">
          <img src="assets/img/Logo.png" alt="La Barra de Jackili Cevichería">
        </a>

        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menú" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="nav-menu" id="navMenu">
          <div class="nav-side nav-side-left">
            <a href="#carta" class="nav-link">Carta</a>
            <a href="#historia" class="nav-link">Historia</a>
          </div>

          <div class="nav-side nav-side-right">
            <a href="#ubicacion" class="nav-link">Ubicación</a>

            <a
              href="https://wa.me/51972667751?text=Hola%20La%20Barra%20de%20Jackili%2C%20quiero%20reservar%20una%20mesa."
              class="reserve-top"
              target="_blank"
              rel="noopener"
            >
              <img src="assets/icons/whatsapp.png" alt="">
              <span>Reservar</span>
            </a>
          </div>
        </div>

      </nav>
    </header>

    <section class="hero" id="inicio">

      <div class="hero-content">
        <h1 class="hero-title">
          <span>El mar</span>
          <span>en un solo</span>
          <span class="soft">bocado</span>
        </h1>

        <p class="hero-copy">
          Pescados y mariscos con sabor criollo, frescura del mar y platos abundantes que te conquistan desde el primer bocado.
        </p>

        <div class="hero-actions">
          <a href="#carta" class="btn btn-white">
            <img src="assets/icons/carta.png" alt="">
            <span>Ver carta</span>
          </a>

          <a
            href="https://wa.me/51972667751?text=Hola%20La%20Barra%20de%20Jackili%2C%20quiero%20reservar%20una%20mesa."
            class="btn btn-outline"
            target="_blank"
            rel="noopener"
          >
            <img src="assets/icons/whatsapp.png" alt="">
            <span>Reservar</span>
          </a>
        </div>
      </div>

      <div class="hero-visual">
        <img
          src="assets/img/imgen_hero.png"
          alt="La Barra de Jackili"
          class="hero-person"
        >

        <img
          src="assets/img/sello.png"
          alt="Fresco del mar"
          class="fresh-seal"
        >

        <div class="hero-caption">
          <span class="small">Más rico de</span>
          <span class="script">todo el Perú</span>
        </div>
      </div>

    </section>

  </main>

  <script>
    const navbar = document.getElementById("navbar");
    const menuToggle = document.getElementById("menuToggle");

    menuToggle.addEventListener("click", () => {
      const isOpen = navbar.classList.toggle("is-open");
      menuToggle.classList.toggle("is-active", isOpen);
      menuToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });

    document.querySelectorAll(".nav-link, .reserve-top").forEach((item) => {
      item.addEventListener("click", () => {
        navbar.classList.remove("is-open");
        menuToggle.classList.remove("is-active");
        menuToggle.setAttribute("aria-expanded", "false");
      });
    });
  </script>
</body>
</html>
