<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>La Barra de Jackili</title>

  <style>
    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk Light.otf") format("opentype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "SansitaSwashed";
      src: url("assets/fonts/SansitaSwashed-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --blue: #006eed;
      --blue-dark: #005cc9;
      --blue-soft: #70b2fa;
      --white: #ffffff;
      --nav-text: #0056bd;
      --container: 1115px;
      --pill: 999px;
      --shadow-menu: 0 18px 40px rgba(0, 37, 105, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--blue);
      color: var(--white);
      font-family: "RocGrotesk", Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: 0;
      background: transparent;
      font-family: inherit;
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .page {
      min-height: 100vh;
      overflow: hidden;
      background: var(--blue);
    }

    .svg-icon {
      width: 20px;
      height: 20px;
      display: inline-block;
      flex: 0 0 auto;
      background-color: currentColor;
      -webkit-mask: var(--icon) center / contain no-repeat;
      mask: var(--icon) center / contain no-repeat;
    }

    .icon-whatsapp {
      --icon: url("assets/icons/whatsapp.svg");
    }

    .icon-carta {
      --icon: url("assets/icons/carta.svg");
    }

    /* =========================
       HEADER MOBILE FIRST
    ========================= */

    .site-header {
      position: relative;
      z-index: 50;
      width: 100%;
      padding: 8px 8px 0;
    }

    .navbar {
      position: relative;
      width: 100%;
      min-height: 64px;
      padding: 0 12px 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--white);
      border-radius: var(--pill);
      box-shadow: 0 10px 28px rgba(0, 40, 120, 0.08);
    }

    .brand {
      width: 122px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }

    .brand:hover {
      transform: scale(1.035);
    }

    .brand img {
      width: 100%;
      height: auto;
    }

    .nav-desktop {
      display: none;
    }

    .menu-toggle {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .menu-toggle:hover {
      background: var(--blue-dark);
      transform: scale(1.04);
    }

    .menu-toggle span {
      width: 20px;
      height: 2px;
      display: block;
      border-radius: 50px;
      background: var(--white);
      transition: 0.25s ease;
    }

    .menu-toggle.is-active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .menu-toggle.is-active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.is-active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .mobile-panel {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      z-index: 80;
      width: min(360px, calc(100vw - 28px));
      padding: 14px;
      display: grid;
      gap: 9px;
      background: var(--white);
      border-radius: 26px;
      box-shadow: var(--shadow-menu);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(-50%) translateY(-8px);
      transition:
        opacity 0.25s ease,
        transform 0.25s ease,
        visibility 0.25s ease;
    }

    .navbar.is-open .mobile-panel {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .nav-link {
      position: relative;
      min-height: 44px;
      padding: 0 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--nav-text);
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.01em;
      border-radius: var(--pill);
      white-space: nowrap;
      transition:
        color 0.25s ease,
        background 0.25s ease,
        transform 0.25s ease;
    }

    .nav-link::before,
    .nav-link::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 27px;
      height: 15px;
      background-color: currentColor;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .nav-link::before {
      left: 10px;
      -webkit-mask: url("assets/img/left.svg") center / contain no-repeat;
      mask: url("assets/img/left.svg") center / contain no-repeat;
      transform: translate(-7px, -50%);
    }

    .nav-link::after {
      right: 10px;
      -webkit-mask: url("assets/img/right.svg") center / contain no-repeat;
      mask: url("assets/img/right.svg") center / contain no-repeat;
      transform: translate(7px, -50%);
    }

    .nav-link:hover {
      color: var(--blue);
      background: rgba(0, 110, 237, 0.06);
      transform: translateY(-1px);
    }

    .nav-link:hover::before,
    .nav-link:hover::after {
      opacity: 1;
      transform: translate(0, -50%);
    }

    .reserve-top {
      min-height: 50px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: var(--white);
      background: var(--blue);
      border-radius: var(--pill);
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      line-height: 1;
      transition:
        background 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .reserve-top:hover {
      color: var(--white);
      background: var(--blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 75, 165, 0.22);
    }

    /* =========================
       HERO MOBILE FIRST
    ========================= */

    .hero {
      position: relative;
      z-index: 5;
      width: 100%;
      padding: 18px 18px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-visual {
      position: relative;
      order: 1;
      width: min(370px, 100%);
      height: 352px;
      margin-top: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: visible;
    }

    .hero-person {
      position: absolute;
      left: 50%;
      top: 34px;
      z-index: 2;
      width: min(268px, 72vw);
      height: auto;
      transform: translateX(-50%);
      user-select: none;
      pointer-events: none;
    }

    .fresh-seal {
      position: absolute;
      left: 70px;
      top: 174px;
      z-index: 6;
      width: 62px;
      height: 62px;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .hero-caption {
      position: absolute;
      left: 50%;
      top: 184px;
      z-index: 7;
      width: 158px;
      transform: translateX(-50%);
      color: var(--white);
      text-align: center;
      pointer-events: none;
    }

    .hero-caption .small {
      display: block;
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 13.5px;
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: 0.01em;
      opacity: 0.72;
    }

    .hero-caption .script {
      display: block;
      margin-top: -1px;
      font-family: "SansitaSwashed", cursive;
      font-size: 20px;
      font-weight: 500;
      line-height: 0.92;
      color: var(--white);
      text-shadow: 0 2px 5px rgba(0, 30, 90, 0.12);
    }

    .hero-content {
      position: relative;
      z-index: 8;
      order: 2;
      width: min(430px, 100%);
      margin-top: -6px;
      text-align: center;
    }

    .hero-title {
      color: var(--white);
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: clamp(40px, 11.8vw, 54px);
      font-weight: 500;
      line-height: 0.84;
      letter-spacing: -0.045em;
    }

    .hero-title span {
      display: block;
    }

    .hero-title .soft {
      color: var(--blue-soft);
    }

    .hero-copy {
      width: min(345px, 100%);
      margin: 14px auto 0;
      color: var(--white);
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 14.8px;
      font-weight: 400;
      line-height: 1.22;
      letter-spacing: 0.01em;
    }

    .hero-actions {
      order: 3;
      width: min(360px, 100%);
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      justify-items: stretch;
    }

    .btn {
      width: 100%;
      min-height: 46px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: var(--pill);
      font-family: "RocGrotesk", Arial, sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .btn .svg-icon {
      width: 17px;
      height: 17px;
    }

    .btn-white {
      color: var(--blue);
      background: var(--white);
      border: 2px solid var(--white);
    }

    .btn-white:hover {
      color: var(--blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 40, 120, 0.24);
    }

    .btn-outline {
      color: var(--white);
      background: transparent;
      border: 2px solid var(--white);
    }

    .btn-outline:hover {
      color: var(--blue);
      background: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 40, 120, 0.2);
    }

    /* =========================
       MOBILE MUY PEQUEÑO
    ========================= */

    @media (max-width: 390px) {
      .site-header {
        padding-left: 8px;
        padding-right: 8px;
        padding-top: 8px;
      }

      .navbar {
        min-height: 62px;
        padding-left: 22px;
        padding-right: 11px;
      }

      .brand {
        width: 116px;
      }

      .menu-toggle {
        width: 40px;
        height: 40px;
      }

      .hero {
        padding-left: 14px;
        padding-right: 14px;
        padding-top: 16px;
        padding-bottom: 8px;
      }

      .hero-visual {
        height: 338px;
      }

      .hero-person {
        top: 30px;
        width: min(252px, 70vw);
      }

      .fresh-seal {
        width: 58px;
        height: 58px;
        top: 168px;
        left: 58px;
      }

      .hero-caption {
        top: 178px;
        width: 150px;
      }

      .hero-caption .small {
        font-size: 12.5px;
      }

      .hero-caption .script {
        font-size: 18.5px;
      }

      .hero-content {
        margin-top: -8px;
      }

      .hero-title {
        font-size: clamp(38px, 11vw, 50px);
      }

      .hero-copy {
        margin-top: 12px;
        font-size: 14.2px;
        line-height: 1.18;
      }

      .hero-actions {
        margin-top: 14px;
        gap: 8px;
      }

      .btn {
        min-height: 44px;
        font-size: 13.6px;
        padding: 0 9px;
      }

      .btn .svg-icon {
        width: 16px;
        height: 16px;
      }
    }

    /* =========================
       TABLET
    ========================= */

    @media (min-width: 768px) {
      .site-header {
        padding: 28px 28px 0;
      }

      .navbar {
        width: min(720px, 100%);
        min-height: 76px;
        margin: 0 auto;
        padding-left: 28px;
        padding-right: 18px;
      }

      .brand {
        width: 170px;
      }

      .hero {
        padding-top: 50px;
        padding-bottom: 24px;
      }

      .hero-visual {
        width: min(500px, 100%);
        height: 520px;
        margin-top: 18px;
      }

      .hero-person {
        top: auto;
        bottom: 0;
        width: min(420px, 70vw);
      }

      .fresh-seal {
        width: 108px;
        height: 108px;
        top: 200px;
        left: 8px;
      }

      .hero-caption {
        top: auto;
        bottom: 68px;
      }

      .hero-caption .small {
        font-size: 22px;
      }

      .hero-caption .script {
        font-size: 31px;
      }

      .hero-content {
        width: min(620px, 100%);
        margin-top: 16px;
      }

      .hero-title {
        font-size: clamp(78px, 11vw, 106px);
      }

      .hero-copy {
        width: min(520px, 100%);
        font-size: 21px;
        line-height: 1.32;
      }

      .hero-actions {
        width: min(430px, 100%);
        display: flex;
        justify-content: center;
        gap: 18px;
      }

      .btn {
        width: auto;
        min-width: 180px;
        min-height: 56px;
        font-size: 16px;
      }
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 1024px) {
      .site-header {
        padding: 38px 20px 0;
      }

      .navbar {
        width: min(var(--container), calc(100vw - 32px));
        height: 82px;
        min-height: 82px;
        margin: 0 auto;
        padding: 0 18px 0 30px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        justify-content: initial;
      }

      .brand {
        grid-column: 2;
        grid-row: 1;
        width: 200px;
        justify-self: center;
      }

      .nav-desktop {
        display: flex;
        align-items: center;
      }

      .nav-left {
        grid-column: 1;
        grid-row: 1;
        justify-self: start;
        gap: 42px;
      }

      .nav-right {
        grid-column: 3;
        grid-row: 1;
        justify-self: end;
        gap: 38px;
      }

      .menu-toggle,
      .mobile-panel {
        display: none;
      }

      .nav-link {
        min-height: 36px;
        padding: 0 22px;
        font-size: 17px;
        background: transparent;
      }

      .nav-link::before {
        left: -5px;
      }

      .nav-link::after {
        right: -5px;
      }

      .nav-link:hover {
        background: transparent;
      }

      .reserve-top {
        min-height: 58px;
        padding: 0 30px;
        font-size: 17px;
      }

      .hero {
        width: min(var(--container), calc(100vw - 32px));
        min-height: calc(100vh - 120px);
        margin: 0 auto;
        padding: 38px 0 0;
        display: grid;
        grid-template-columns: 46% 54%;
        grid-template-rows: auto auto;
        align-items: center;
      }

      .hero-visual {
        grid-column: 1;
        grid-row: 1 / 3;
        order: initial;
        width: 100%;
        height: 100%;
        min-height: 535px;
        margin-top: 0;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
      }

      .hero-content {
        grid-column: 2;
        grid-row: 1;
        order: initial;
        width: 100%;
        max-width: none;
        margin-top: 0;
        padding-left: 12px;
        text-align: left;
        transform: translateY(22px);
      }

      .hero-actions {
        grid-column: 2;
        grid-row: 2;
        order: initial;
        width: 100%;
        margin-top: -18px;
        padding-left: 12px;
        display: flex;
        justify-content: flex-start;
        gap: 34px;
      }

      .hero-title {
        max-width: 650px;
        font-size: clamp(76px, 8.55vw, 126px);
        line-height: 0.85;
      }

      .hero-title .soft {
        padding-left: 118px;
      }

      .hero-copy {
        width: min(560px, 100%);
        margin: 47px 0 0;
        font-size: 24px;
        line-height: 1.28;
      }

      .btn {
        width: auto;
        min-height: 60px;
        min-width: 173px;
        padding: 0 31px;
        font-size: 18px;
      }

      .btn .svg-icon {
        width: 22px;
        height: 22px;
      }

      .btn-outline {
        min-width: 218px;
      }

      .hero-person {
        left: -33px;
        top: auto;
        bottom: -1px;
        width: min(457.35px, 42vw);
        transform: none;
      }

      .fresh-seal {
        left: -8px;
        top: 300px;
        width: 118px;
        height: 118px;
      }

      .hero-caption {
        left: 157px;
        top: auto;
        bottom: 80px;
        width: 205px;
        transform: none;
      }

      .hero-caption .small {
        font-size: 22px;
      }

      .hero-caption .script {
        font-size: 31px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="site-header">
      <nav class="navbar" id="navbar" aria-label="Menú principal">

        <div class="nav-desktop nav-left">
          <a href="#carta" class="nav-link">Carta</a>
          <a href="#historia" class="nav-link">Historia</a>
        </div>

        <a href="#inicio" class="brand" aria-label="La Barra de Jackili">
          <img src="assets/img/Logo.png" alt="La Barra de Jackili Cevichería">
        </a>

        <div class="nav-desktop nav-right">
          <a href="#ubicacion" class="nav-link">Ubicación</a>

          <a
            href="https://wa.me/51972667751?text=Hola%20La%20Barra%20de%20Jackili%2C%20quiero%20reservar%20una%20mesa."
            class="reserve-top"
            target="_blank"
            rel="noopener"
          >
            <span class="svg-icon icon-whatsapp"></span>
            <span>Reservar</span>
          </a>
        </div>

        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menú" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="mobile-panel" id="mobilePanel">
          <a href="#carta" class="nav-link">Carta</a>
          <a href="#historia" class="nav-link">Historia</a>
          <a href="#ubicacion" class="nav-link">Ubicación</a>

          <a
            href="https://wa.me/51972667751?text=Hola%20La%20Barra%20de%20Jackili%2C%20quiero%20reservar%20una%20mesa."
            class="reserve-top"
            target="_blank"
            rel="noopener"
          >
            <span class="svg-icon icon-whatsapp"></span>
            <span>Reservar</span>
          </a>
        </div>

      </nav>
    </header>

    <section class="hero" id="inicio">

      <div class="hero-visual">
        <img
          src="assets/img/imgen_hero.png"
          alt="La Barra de Jackili"
          class="hero-person"
        >

        <img
          src="assets/img/sello.png"
          alt="Fresco del mar"
          class="fresh-seal"
        >

        <div class="hero-caption">
          <span class="small">Más rico de</span>
          <span class="script">todo el Perú</span>
        </div>
      </div>

      <div class="hero-content">
        <h1 class="hero-title">
          <span>El mar</span>
          <span>en un solo</span>
          <span class="soft">bocado</span>
        </h1>

        <p class="hero-copy">
          Pescados y mariscos con sabor criollo, frescura del mar y platos abundantes que te conquistan desde el primer bocado.
        </p>
      </div>

      <div class="hero-actions">
        <a href="#carta" class="btn btn-white">
          <span class="svg-icon icon-carta"></span>
          <span>Ver carta</span>
        </a>

        <a
          href="https://wa.me/51972667751?text=Hola%20La%20Barra%20de%20Jackili%2C%20quiero%20reservar%20una%20mesa."
          class="btn btn-outline"
          target="_blank"
          rel="noopener"
        >
          <span class="svg-icon icon-whatsapp"></span>
          <span>Reservar</span>
        </a>
      </div>

    </section>

  </main>

  <script>
    const navbar = document.getElementById("navbar");
    const menuToggle = document.getElementById("menuToggle");

    menuToggle.addEventListener("click", () => {
      const isOpen = navbar.classList.toggle("is-open");
      menuToggle.classList.toggle("is-active", isOpen);
      menuToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });

    document.querySelectorAll(".mobile-panel a").forEach((item) => {
      item.addEventListener("click", () => {
        navbar.classList.remove("is-open");
        menuToggle.classList.remove("is-active");
        menuToggle.setAttribute("aria-expanded", "false");
      });
    });

    window.addEventListener("resize", () => {
      if (window.innerWidth >= 1024) {
        navbar.classList.remove("is-open");
        menuToggle.classList.remove("is-active");
        menuToggle.setAttribute("aria-expanded", "false");
      }
    });
