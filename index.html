<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Barra de Jackili - Hero</title>

  <style>
    @font-face {
      font-family: "RocGrotesk";
      src: url("assets/fonts/Roc Grotesk medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "SansitaSwashed";
      src: url("assets/fonts/SansitaSwashed-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --blue: #006eed;
      --blue-soft: #69aef7;
      --white: #ffffff;
      --text-blue: #0056bd;
      --nav-height: 82px;
      --nav-width: 1115px;
      --radius-pill: 999px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "RocGrotesk", Arial, sans-serif;
      background: var(--blue);
      color: var(--white);
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
      border: none;
      cursor: pointer;
    }

    .page-hero {
      position: relative;
      min-height: 100vh;
      background: var(--blue);
      overflow: hidden;
    }

    /* =========================
       HEADER / MENU SUPERIOR
    ========================== */

    .site-header {
      position: relative;
      z-index: 20;
      width: 100%;
      padding: 38px 20px 0;
    }

    .navbar {
      width: min(var(--nav-width), calc(100vw - 32px));
      height: var(--nav-height);
      margin: 0 auto;
      padding: 0 22px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: var(--white);
      border-radius: var(--radius-pill);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .nav-group.left {
      justify-content: flex-start;
      padding-left: 10px;
    }

    .nav-group.right {
      justify-content: flex-end;
    }

    .nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      color: var(--text-blue);
      font-size: 17px;
      line-height: 1;
      letter-spacing: 0.01em;
      transition: transform 0.25s ease, color 0.25s ease;
      white-space: nowrap;
    }

    .nav-link:hover {
      color: var(--blue);
      transform: translateY(-1px);
    }

    .nav-link.has-hover-fish {
      padding: 0 24px;
    }

    .nav-link.has-hover-fish::before,
    .nav-link.has-hover-fish::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 28px;
      height: 16px;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .nav-link.has-hover-fish::before {
      left: -4px;
      background-image: url("assets/img/left.png");
      transform: translate(-8px, -50%);
    }

    .nav-link.has-hover-fish::after {
      right: -4px;
      background-image: url("assets/img/right.png");
      transform: translate(8px, -50%);
    }

    .nav-link.has-hover-fish:hover::before,
    .nav-link.has-hover-fish:hover::after {
      opacity: 1;
      transform: translate(0, -50%);
    }

    .brand {
      width: 190px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.28s ease;
    }

    .brand:hover img {
      transform: scale(1.035);
    }

    .reserve-top {
      height: 58px;
      padding: 0 29px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: var(--blue);
      color: var(--white);
      border-radius: var(--radius-pill);
      font-size: 17px;
      letter-spacing: 0.01em;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .reserve-top img {
      width: 25px;
      height: 25px;
      object-fit: contain;
      display: block;
    }

    .reserve-top:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 55, 130, 0.22);
      background: #005fd1;
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--blue);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
    }

    .menu-toggle span {
      width: 20px;
      height: 2px;
      background: var(--white);
      border-radius: 10px;
      transition: 0.25s ease;
    }

    .menu-toggle.is-active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .menu-toggle.is-active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.is-active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      position: relative;
      z-index: 5;
      width: min(1115px, calc(100vw - 32px));
      min-height: calc(100vh - 120px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 46% 54%;
      align-items: center;
      padding-top: 38px;
    }

    .hero-visual {
      position: relative;
      height: 100%;
      min-height: 535px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }

    .hero-person {
      position: absolute;
      left: -33px;
      bottom: -1px;
      width: min(457.35px, 42vw);
      height: auto;
      z-index: 2;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .fresh-badge {
      position: absolute;
      left: -4px;
      top: 305px;
      width: 112px;
      height: 112px;
      z-index: 4;
      border: 2px solid var(--white);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--white);
      text-transform: uppercase;
      font-size: 15px;
      line-height: 0.95;
      letter-spacing: 0.06em;
      text-align: center;
      background: transparent;
    }

    .fresh-badge .waves {
      width: 58px;
      height: 22px;
      margin-top: 8px;
      display: block;
      background:
        radial-gradient(ellipse at center, transparent 43%, var(--white) 45%, var(--white) 53%, transparent 55%);
      background-size: 29px 11px;
      background-position: 0 0;
      opacity: 0.95;
    }

    .hero-caption {
      position: absolute;
      left: 160px;
      bottom: 80px;
      z-index: 5;
      width: 190px;
      text-align: center;
      color: var(--white);
      pointer-events: none;
    }

    .hero-caption .small {
      display: block;
      font-size: 22px;
      line-height: 0.95;
      opacity: 0.7;
    }

    .hero-caption .script {
      display: block;
      margin-top: -2px;
      font-family: "SansitaSwashed", cursive;
      font-size: 30px;
      line-height: 0.9;
      color: var(--white);
      text-shadow: 0 2px 5px rgba(0, 30, 90, 0.12);
    }

    .hero-content {
      position: relative;
      z-index: 7;
      padding-left: 12px;
      transform: translateY(-10px);
    }

    .hero-title {
      max-width: 650px;
      color: var(--white);
      font-size: clamp(68px, 8.55vw, 126px);
      line-height: 0.85;
      letter-spacing: -0.045em;
      font-weight: 500;
    }

    .hero-title span {
      display: block;
    }

    .hero-title .soft {
      color: var(--blue-soft);
      padding-left: 118px;
    }

    .hero-copy {
      width: min(560px, 100%);
      margin-top: 47px;
      color: var(--white);
      font-size: 24px;
      line-height: 1.28;
      letter-spacing: 0.01em;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 34px;
      margin-top: 32px;
    }

    .btn {
      height: 60px;
      min-width: 173px;
      padding: 0 30px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 18px;
      line-height: 1;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    .btn img {
      width: 21px;
      height: 21px;
      object-fit: contain;
      display: block;
    }

    .btn-primary-white {
      background: var(--white);
      color: var(--blue);
    }

    .btn-primary-white:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(0, 45, 120, 0.2);
    }

    .btn-outline-white {
      background: transparent;
      color: var(--white);
      border: 2px solid var(--white);
      min-width: 218px;
    }

    .btn-outline-white:hover {
      background: var(--white);
      color: var(--blue);
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(0, 45, 120, 0.18);
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 900px) {
      :root {
        --nav-height: 70px;
      }

      .site-header {
        padding-top: 18px;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 0 15px 0 21px;
      }

      .brand {
        width: 148px;
      }

      .menu-toggle {
        display: flex;
      }

      .nav-group {
        position: absolute;
        left: 50%;
        top: calc(100% + 14px);
        width: min(360px, calc(100vw - 32px));
        transform: translateX(-50%) translateY(-8px);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: var(--white);
        border-radius: 28px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        box-shadow: 0 16px 35px rgba(0, 30, 90, 0.18);
        transition: 0.25s ease;
      }

      .nav-group.left,
      .nav-group.right {
        justify-content: flex-start;
        padding-left: 20px;
      }

      .nav-group.left {
        top: calc(100% + 14px);
      }

      .nav-group.right {
        top: calc(100% + 176px);
      }

      .navbar.is-open .nav-group {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }

      .nav-link {
        width: 100%;
        justify-content: flex-start;
        font-size: 17px;
      }

      .reserve-top {
        width: 100%;
        height: 52px;
      }

      .hero {
        width: min(430px, calc(100vw - 28px));
        min-height: auto;
        display: flex;
        flex-direction: column;
        padding-top: 44px;
      }

      .hero-content {
        order: 1;
        width: 100%;
        padding-left: 0;
        transform: none;
        text-align: center;
      }

      .hero-title {
        max-width: 100%;
        font-size: clamp(54px, 17vw, 76px);
        line-height: 0.88;
      }

      .hero-title .soft {
        padding-left: 0;
      }

      .hero-copy {
        width: 100%;
        margin-top: 26px;
        font-size: 18px;
        line-height: 1.38;
      }

      .hero-actions {
        width: 100%;
        margin-top: 26px;
        gap: 14px;
        justify-content: center;
        flex-direction: column;
      }

      .btn {
        width: min(310px, 100%);
        height: 56px;
        font-size: 17px;
      }

      .hero-visual {
        order: 2;
        width: 100%;
        min-height: 460px;
        margin-top: 20px;
      }

      .hero-person {
        left: 50%;
        transform: translateX(-50%);
        bottom: 0;
        width: min(360px, 92vw);
      }

      .fresh-badge {
        left: 8px;
        top: 135px;
        width: 92px;
        height: 92px;
        font-size: 12px;
      }

      .fresh-badge .waves {
        width: 48px;
        height: 18px;
        background-size: 24px 9px;
      }

      .hero-caption {
        left: 50%;
        bottom: 56px;
        transform: translateX(-50%);
      }

      .hero-caption .small {
        font-size: 18px;
      }

      .hero-caption .script {
        font-size: 26px;
      }
    }

    @media (max-width: 480px) {
      .brand {
        width: 132px;
      }

      .hero-visual {
        min-height: 410px;
      }

      .hero-person {
        width: min(330px, 96vw);
      }

      .fresh-badge {
        left: 0;
        top: 130px;
      }
    }
  </style>
</head>

<body>
  <main class="page-hero">

    <header class="site-header">
      <nav class="navbar" id="navbar" aria-label="Menú principal">
        <div class="nav-group left">
          <a href="#carta" class="nav-link has-hover-fish">Carta</a>
          <a href="#historia" class="nav-link">Historia</a>
        </div>

        <a href="#" class="brand" aria-label="La Barra de Jackili">
          <img src="assets/img/Logo.png" alt="La Barra de Jackili Cevichería">
        </a>

        <div class="nav-group right">
          <a href="#ubicacion" class="nav-link">Ubicación</a>

          <a
            href="https://wa.me/51972667751?text=Hola%20La%20Barra%20de%20Jackili%2C%20quiero%20reservar%20una%20mesa."
            class="reserve-top"
            target="_blank"
            rel="noopener"
          >
            <img src="assets/icons/whatsapp.png" alt="">
            <span>Reservar</span>
          </a>
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </nav>
    </header>

    <section class="hero" id="inicio">
      <div class="hero-visual">
        <img
          src="assets/img/imgen_hero.png"
          alt="Persona sosteniendo un plato marino de La Barra de Jackili"
          class="hero-person"
        >

        <div class="fresh-badge" aria-hidden="true">
          <span>Fresco</span>
          <span>del mar</span>
          <i class="waves"></i>
        </div>

        <div class="hero-caption">
          <span class="small">Más rico de</span>
          <span class="script">todo el Perú</span>
        </div>
      </div>

      <div class="hero-content">
        <h1 class="hero-title">
          <span>El mar</span>
          <span>en un solo</span>
          <span class="soft">bocado</span>
        </h1>

        <p class="hero-copy">
          Pescados y mariscos con sabor criollo, frescura del mar y platos abundantes que te conquistan desde el primer bocado.
        </p>

        <div class="hero-actions">
          <a href="#carta" class="btn btn-primary-white">
            <img src="assets/icons/carta.png" alt="">
            <span>Ver carta</span>
          </a>

          <a
            href="https://wa.me/51972667751?text=Hola%20La%20Barra%20de%20Jackili%2C%20quiero%20reservar%20una%20mesa."
            class="btn btn-outline-white"
            target="_blank"
            rel="noopener"
          >
            <img src="assets/icons/whatsapp.png" alt="">
            <span>Reservar</span>
          </a>
        </div>
      </div>
    </section>

  </main>

  <script>
    const navbar = document.getElementById("navbar");
    const menuToggle = document.getElementById("menuToggle");

    menuToggle.addEventListener("click", () => {
      const isOpen = navbar.classList.toggle("is-open");
      menuToggle.classList.toggle("is-active", isOpen);
      menuToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });

    document.querySelectorAll(".nav-link, .reserve-top").forEach((item) => {
      item.addEventListener("click", () => {
        navbar.classList.remove("is-open");
        menuToggle.classList.remove("is-active");
        menuToggle.setAttribute("aria-expanded", "false");
      });
    });
  </script>
</body>
</html>
